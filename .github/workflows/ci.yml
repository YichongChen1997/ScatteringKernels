name: checks

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Frozen paper inputs are unchanged and none were added
        run: python3 tests/regress/check_frozen.py
      - name: No large or forbidden files
        run: python3 tests/regress/check_hygiene.py
      - name: Stored reference outputs match their checksums
        run: cd tests/reference/R3_channel_mini/mini && sha256sum -c SHA256SUMS
      - name: Any change to the references is recorded in CHANGES.md
        if: github.event_name == 'pull_request'
        run: python3 tests/regress/check_reference_changes.py origin/${{ github.base_ref }}
